# 공저자 메타데이터. 여기 이름이 papers.bib 의 저자와 일치하면 그 이름에 링크가 붙는다.
# 본인 이름은 여기가 아니라 _config.yml 의 `scholar:` 가 처리한다.
#
# 키는 소문자 성, 악센트 없이. firstname 에는 나타날 수 있는 표기를 모두 적는다
# ("Jane", "J.") — Google Scholar 는 이름을 줄여 쓴다.
#
# 예시 (실존 인물 아님):
# "doe":
#   - firstname: ["Jane", "J."]
#     url: https://example.com
